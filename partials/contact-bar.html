<!-- #region CONTACT BAR -->
<header class="contact-bar" id="contactBar">
  <span class="top-logo"
    ><svg width="48" height="48" aria-hidden="true">
      <use href="/img/logos-sprite.svg#icon-me-logo" /></svg
  ></span>
  <p class="name">Oleksandr Prudskyi</p>
  <ul class="contact-info tabular-nums">
    <li class="contact-item">
      <span class="icon" aria-hidden="true"><i class="ph ph-map-pin"></i></span>
      <p class="contact-item-text">Liberec</p>
    </li>
    <li class="contact-item">
      <span class="icon" aria-hidden="true"><i class="ph ph-phone"></i></span>
      <p class="contact-item-text desktop-phone">+420 773 714 660</p>
      <p class="contact-item-text mobile-phone">
        <a href="tel:+420773714660" class="phone-link">+420 773 714 660</a>
      </p>
    </li>
    <li class="contact-item">
      <span class="icon" aria-hidden="true"><i class="ph ph-envelope-simple"></i></span>
      <p class="contact-item-text desktop-email">oleksandr.prudskyi@gmail.com</p>
      <p class="contact-item-text mobile-email">
        <a href="mailto:oleksandr.prudskyi@gmail.com" class="email-link">oleksandr.prudskyi@gmail.com</a>
      </p>
      <button
        class="btn btn-copy contact-copy-btn"
        type="button"
        title="Zkopírovat email"
        aria-label="Zkopírovat email"
      >
        <i class="ph ph-copy" aria-hidden="true"></i>
      </button>
    </li>
  </ul>
</header>
<!-- #endregion CONTACT BAR -->
