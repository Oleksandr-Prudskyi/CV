<!-- #region HERO -->
<section class="hero">
  <svg
    class="hero-bg-svg"
    viewBox="0 0 45 32"
    preserveAspectRatio="xMidYMid slice"
    aria-hidden="true"
  >
    <use href="#icon-ukr-picture" />
  </svg>
  <article class="hero-content">
    <div class="avatar-wrapper">
      <button
        class="avatar-placeholder has-image"
        id="avatarPlaceholder"
        type="button"
        aria-label="Zobrazit fotografii"
      >
        <i class="ph ph-user avatar-icon"></i>
        <img src="/img/photo.png" alt="Oleksandr Prudskyi" id="avatarImage" />
      </button>
    </div>
    <h1>OLEKSANDR<br />PRUDSKYI</h1>
    <p class="birth-info">
      <time class="birth-date" datetime="1997-09-26">26. 09. 1997</time>
      <span
        class="libra-icon"
        id="libraSymbol"
        title="Váhy / Libra"
        aria-label="Váhy"
      >
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <use href="/img/logos-sprite.svg#icon-libra" />
        </svg>
      </span>
    </p>
    <ul class="contact-grid">
      <li class="contact-card glass-card">
        <span class="icon"><i class="ph-fill ph-map-pin"></i></span>
        <p class="text">
          <span class="label">Adresa</span
          ><span class="value">U Nisy 913/4, Liberec</span>
        </p>
      </li>
      <li class="contact-card glass-card">
        <span class="icon"><i class="ph-fill ph-phone"></i></span>
        <p class="text">
          <span class="label">Telefon</span
          ><span class="value desktop-phone">+420 773 714 660</span
          ><span class="value mobile-phone"
            ><a href="tel:+420773714660" class="phone-link"
              >+420 773 714 660</a
            ></span
          >
        </p>
      </li>
      <li class="contact-card email-card glass-card">
        <span class="icon"><i class="ph-fill ph-envelope-simple"></i></span>
        <p class="text">
          <span class="label">Email</span
          ><span class="value">oleksandr.prudskyi@gmail.com</span>
        </p>
        <button
          class="btn btn-copy hero-copy-btn"
          type="button"
          title="Zkopírovat email"
          aria-label="Zkopírovat email"
        >
          <i class="ph ph-copy"></i> Zkopírovat
        </button>
      </li>
    </ul>
  </article>
</section>
<!-- #endregion HERO -->
