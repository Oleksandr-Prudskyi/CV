<!-- #region HERO -->
<section class="hero" id="heroSection" aria-labelledby="heroTitle">
  <svg
    class="hero-bg-svg"
    viewBox="0 0 45 32"
    preserveAspectRatio="xMidYMid slice"
    aria-hidden="true"
  >
    <use href="#icon-ukr-picture" />
  </svg>
  <article class="hero-content">
    <div class="avatar-wrapper">
      <button
        class="avatar-placeholder has-image"
        id="avatarPlaceholder"
        type="button"
        aria-label="Zobrazit fotografii"
      >
        <i class="ph ph-user avatar-icon"></i>
        <picture>
          <source srcset="/img/photo.webp" type="image/webp" />
          <img
            src="/img/photo.png"
            alt="Oleksandr Prudskyi"
            id="avatarImage"
            decoding="async"
            fetchpriority="high"
          />
        </picture>
      </button>
    </div>
    <h1 id="heroTitle">
      <span class="hero-name-first">Oleksandr</span>
      <span class="hero-name-last">Prudskyi</span>
    </h1>
    <p class="typed-subtitle" aria-label="Přeji Vám krásný den">
      <span class="typed-text" id="typedText"></span>
      <span class="typed-cursor" aria-hidden="true">|</span>
    </p>
    <ul class="contact-grid">
      <li class="contact-card glass-card">
        <span class="icon"><i class="ph-fill ph-map-pin"></i></span>
        <p class="text">
          <span class="label">Adresa</span
          ><span class="value">Liberec, Česká republika</span>
        </p>
      </li>
      <li class="contact-card glass-card">
        <span class="icon"><i class="ph-fill ph-phone"></i></span>
        <p class="text">
          <span class="label">Telefon</span
          ><span class="value desktop-phone">+420 773 714 660</span
          ><span class="value mobile-phone"
            ><a href="tel:+420773714660" class="phone-link"
              >+420 773 714 660</a
            ></span
          >
        </p>
      </li>
      <li class="contact-card email-card glass-card">
        <span class="icon"><i class="ph-fill ph-envelope-simple"></i></span>
        <p class="text">
          <span class="label">Email</span
          ><span class="value desktop-email">oleksandr.prudskyi@gmail.com</span
          ><span class="value mobile-email"
            ><a href="mailto:oleksandr.prudskyi@gmail.com" class="email-link"
              >oleksandr.prudskyi@gmail.com</a
            ></span
          >
        </p>
        <button
          class="btn btn-copy hero-copy-btn"
          type="button"
          title="Zkopírovat email"
          aria-label="Zkopírovat email"
        >
          <i class="ph ph-copy"></i> Zkopírovat
        </button>
      </li>
    </ul>
  </article>
</section>
<!-- #endregion HERO -->
