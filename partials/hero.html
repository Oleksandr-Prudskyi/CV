<!-- #region HERO -->
<section class="hero" id="heroSection" aria-labelledby="heroTitle">
  <svg
    class="hero-bg-svg"
    viewBox="0 0 45 32"
    preserveAspectRatio="xMidYMid slice"
    aria-hidden="true"
  >
    <use href="#icon-ukr-picture" />
  </svg>
  <article class="hero-content">
    <div class="avatar-wrapper">
      <button
        class="avatar-placeholder has-image"
        id="avatarPlaceholder"
        type="button"
        aria-label="Zobrazit fotografii"
      >
        <i class="ph ph-user avatar-icon"></i>
        <picture>
          <source srcset="/img/photo.webp" type="image/webp" />
          <img
            src="/img/photo.png"
            alt="Oleksandr Prudskyi"
            id="avatarImage"
            decoding="async"
            fetchpriority="high"
          />
        </picture>
      </button>
    </div>
    <h1 id="heroTitle" itemscope itemtype="https://schema.org/Person" itemprop="name">
      <meta itemprop="givenName" content="Oleksandr" />
      <meta itemprop="familyName" content="Prudskyi" />
      <span class="hero-name-first">Oleksandr</span>
      <span class="hero-name-last">Prudskyi</span>
    </h1>
    <p class="typed-subtitle" aria-label="Přeji Vám krásný den">
      <span class="typed-text" id="typedText"></span>
      <span class="typed-cursor" aria-hidden="true">|</span>
    </p>
    <div class="hero-actions">
      <a
        href="Files/CV_Oleksandr_Prudskyi.pdf?v=2"
        class="btn btn-hero-primary"
        id="heroCvBtn"
        target="_blank"
        rel="noopener"
      >
        <i class="ph-bold ph-download-simple" aria-hidden="true"></i>
        <span>Stáhnout CV</span>
      </a>
      <a
        href="https://github.com/Oleksandr-Prudskyi"
        class="btn btn-hero-secondary"
        target="_blank"
        rel="noopener"
        aria-label="GitHub"
      >
        <svg class="hero-social-icon" width="18" height="18" aria-hidden="true">
          <use href="/img/logos-sprite.svg#icon-github" />
        </svg>
        <span>GitHub</span>
      </a>
      <a
        href="https://www.linkedin.com/in/oleksandr-prudskyi-%F0%9F%87%BA%F0%9F%87%A6-%F0%9F%87%A8%F0%9F%87%BF-788a11372/"
        class="btn btn-hero-secondary"
        target="_blank"
        rel="noopener"
        aria-label="LinkedIn"
      >
        <svg class="hero-social-icon" width="18" height="18" aria-hidden="true">
          <use href="/img/logos-sprite.svg#icon-linkedin" />
        </svg>
        <span>LinkedIn</span>
      </a>
      <a
        href="https://www.instagram.com/pro_libra/"
        class="btn btn-hero-secondary"
        target="_blank"
        rel="noopener"
        aria-label="Instagram"
      >
        <svg class="hero-social-icon" width="18" height="18" aria-hidden="true">
          <use href="/img/logos-sprite.svg#icon-instagram" />
        </svg>
        <span>Instagram</span>
      </a>
    </div>
    <ul class="contact-grid">
      <li class="contact-card glass-card">
        <span class="icon" aria-hidden="true"><i class="ph-fill ph-map-pin"></i></span>
        <div class="text">
          <p class="label">Adresa</p>
          <h3 class="value">Liberec</h3>
        </div>
      </li>
      <li class="contact-card glass-card" itemscope itemtype="https://schema.org/ContactPoint">
        <span class="icon" aria-hidden="true"><i class="ph-fill ph-phone"></i></span>
        <div class="text">
          <p class="label">Telefon</p>
          <h3 class="value desktop-phone" itemprop="telephone">+420 773 714 660</h3>
          <h3 class="value mobile-phone">
            <a href="tel:+420773714660" class="phone-link" itemprop="telephone">+420 773 714 660</a>
          </h3>
        </div>
      </li>
      <li class="contact-card email-card glass-card" itemscope itemtype="https://schema.org/ContactPoint">
        <span class="icon" aria-hidden="true"><i class="ph-fill ph-envelope-simple"></i></span>
        <div class="text">
          <p class="label">Email</p>
          <h3 class="value desktop-email" itemprop="email">oleksandr.prudskyi@gmail.com</h3>
          <h3 class="value mobile-email">
            <a href="mailto:oleksandr.prudskyi@gmail.com" class="email-link" itemprop="email">oleksandr.prudskyi@gmail.com</a>
          </h3>
        </div>
        <button
          class="btn btn-copy hero-copy-btn"
          type="button"
          title="Zkopírovat email"
          aria-label="Zkopírovat email"
        >
          <i class="ph ph-copy" aria-hidden="true"></i> Zkopírovat
        </button>
      </li>
    </ul>
  </article>
</section>
<!-- #endregion HERO -->
