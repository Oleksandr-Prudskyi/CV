<!-- #region SIDE ACTIONS -->
<aside class="side-buttons">
  <div class="download-wrapper">
    <button
      class="btn download-btn circle-btn"
      id="dlCvBtn"
      type="button"
      title="Stáhnout krátký životopis"
      aria-label="Stáhnout krátký životopis"
    >
      <span class="dl-arrow-shaft"></span><span class="dl-arrow-head"></span
      ><span class="dl-tray"></span></button
    ><span class="download-label">Krátký životopis</span>
  </div>
  <div class="social-box">
    <button
      class="btn social-btn circle-btn"
      id="socialBtn"
      type="button"
      title="Sociální sítě"
      aria-label="Sociální sítě"
      aria-expanded="false"
      aria-controls="socialPanel"
    >
      <svg class="social-btn-icon" width="36" height="36" aria-hidden="true">
        <use href="/img/logos-sprite.svg#icon-share-network" />
      </svg></button
    ><span class="social-label">Sociální sítě</span>
    <div class="social-panel" id="socialPanel">
      <span class="social-nickname"
        ><svg class="nickname-svg" aria-label="PrO_Libra">
          <use href="/img/logos-sprite.svg#icon-nickname" /></svg
      ></span>
      <nav class="social-links">
        <a
          href="https://www.instagram.com/pro_libra?igsh=MW9vejZvczZtMmRzdw=="
          target="_blank"
          rel="noopener"
          title="Instagram"
          aria-label="Instagram"
          ><svg class="social-icon" width="20" height="20" aria-hidden="true">
            <use href="/img/logos-sprite.svg#icon-instagram" /></svg></a
        ><a
          href="https://www.linkedin.com/in/oleksandr-prudskyi-788a11372/"
          target="_blank"
          rel="noopener"
          title="LinkedIn"
          aria-label="LinkedIn"
          ><svg class="social-icon" width="20" height="20" aria-hidden="true">
            <use href="/img/logos-sprite.svg#icon-linkedin" /></svg></a
        ><a
          href="https://github.com/Oleksandr-Prudskyi"
          target="_blank"
          rel="noopener"
          title="GitHub"
          aria-label="GitHub"
          ><svg class="social-icon" width="20" height="20" aria-hidden="true">
            <use href="/img/logos-sprite.svg#icon-github" /></svg></a
        ><a
          href="https://t.me/PrO_Libra"
          target="_blank"
          rel="noopener"
          title="Telegram"
          aria-label="Telegram"
          ><svg class="social-icon" width="20" height="20" aria-hidden="true">
            <use href="/img/logos-sprite.svg#icon-telegram" /></svg
        ></a>
      </nav>
    </div>
  </div>
</aside>
<aside
  class="photo-modal"
  id="photoModal"
  role="dialog"
  aria-modal="true"
  aria-label="Fotografie"
>
  <button class="photo-modal-close" type="button" aria-label="Zavřít">
    &times;</button
  ><img src="/img/photo.png" alt="Oleksandr Prudskyi" />
</aside>
<!-- #endregion SIDE ACTIONS -->
